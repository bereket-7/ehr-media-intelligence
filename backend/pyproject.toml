[project]
name = "ehr-media-intelligence"
version = "0.1.0"
description = "EHR Media Intelligence Platform - Assessment Prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.34",
    "fhir.resources>=8.3.0",
    "fhir-core>=1.1.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -p no:django"
pythonpath = ["."]
filterwarnings = [
    "ignore:.*StarletteDeprecationWarning.*",
]
